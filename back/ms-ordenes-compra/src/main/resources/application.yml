spring:
  application:
    name: ms-ordenes-compra
  datasource:
    url: jdbc:postgresql://localhost:5432/bd_ordenes
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083
  error:
    include-message: always

servicios:
  cotizaciones:
    url: http://localhost:8082
