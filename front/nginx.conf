server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker. Resolver en cada petición permite que nginx arranque
  # aunque algún microservicio esté detenido (responde 502 hasta que vuelva).
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  proxy_connect_timeout 3s;
  proxy_read_timeout 60s;

  # El navegador solo habla con este servidor (mismo origen, sin problemas de CORS)
  # y nginx reenvía cada ruta a su microservicio.
  location /srv/proveedores/ {
    set $destino http://proveedores:8080;
    rewrite ^/srv/proveedores/(.*)$ /$1 break;
    proxy_pass $destino;
  }

  location /srv/cotizaciones/ {
    set $destino http://cotizaciones:8082;
    rewrite ^/srv/cotizaciones/(.*)$ /$1 break;
    proxy_pass $destino;
  }

  location /srv/ordenes/ {
    set $destino http://ordenes:8083;
    rewrite ^/srv/ordenes/(.*)$ /$1 break;
    proxy_pass $destino;
  }

  location /srv/recepcion/ {
    set $destino http://recepcion:8084;
    rewrite ^/srv/recepcion/(.*)$ /$1 break;
    proxy_pass $destino;
  }

  # Rutas de React Router: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
